name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        env:
          GITHUB_WEBHOOK_SECRET: test_secret_for_ci
          GITHUB_APP_ID: "12345"
          ANTHROPIC_API_KEY: test_key
        run: |
          pytest test_main.py -v

      - name: Check no secrets in code
        run: |
          grep -r "sk-ant-" . --include="*.py" && echo "ANTHROPIC KEY FOUND IN CODE" && exit 1 || echo "No secrets found"
          grep -r "BEGIN RSA" . --include="*.py" && echo "PRIVATE KEY FOUND IN CODE" && exit 1 || echo "No private keys found"